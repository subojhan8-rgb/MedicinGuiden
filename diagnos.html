<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnos | MedicinGuiden</title><style>:root{font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:#071525;color:#e8f1fa}*{box-sizing:border-box}body{margin:0;line-height:1.6}a{color:#6adccc}header{background:#0c1c30;border-bottom:1px solid #29425a;padding:18px 5%}header a{text-decoration:none;font-weight:800;font-size:22px}main{max-width:1100px;margin:auto;padding:26px 20px 65px}h1{font-size:clamp(30px,5vw,44px);margin:7px 0 14px}h2{font-size:21px}h3{font-size:16px}.category{color:#6cdccc;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}.muted{color:#b0c3d6}.notice{background:#30271c;border:1px solid #85643e;padding:15px;border-radius:12px;margin:21px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#11243a;border:1px solid #304b65;border-radius:14px;padding:21px}.panel p{color:#c0d0df}.panel h2{margin:0 0 10px}.wide{margin-top:17px}.subtle{font-size:13px;color:#adbdcc}.ecg{width:100%;background:white;border-radius:10px;margin:14px 0;display:block;max-height:300px}.imaging{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.scan{border:1px solid #35506a;border-radius:12px;padding:14px;background:#0a1828}.scan svg{width:100%;height:175px;display:block;border-radius:9px;background:#0a111a}.scan h3{margin:9px 0 4px}.scan p{font-size:12px;margin:0;color:#abbccc}.tablewrap{overflow:auto;border:1px solid #304b65;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px;vertical-align:top;border-bottom:1px solid #304b65;text-align:left}th{background:#19364e;color:#ddf5ef}td{background:#102339}.ref li{margin-bottom:10px}.doselist li{margin:6px 0}.btnlink{display:inline-block;background:#174d52;padding:8px 13px;border-radius:8px;margin-bottom:15px;text-decoration:none}footer{border-top:1px solid #29425a;color:#95aac1;text-align:center;padding:24px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px 13px 55px}}@media print{body{background:#fff;color:#111}header,footer,.btnlink{display:none}.panel,td{background:white;color:black;border-color:#aaa}.muted,.subtle{color:#444}}</style></head><body><header><a href="./index.html">✚ MedicinGuiden</a></header><main><a class="btnlink" href="./index.html">← Till diagnosbiblioteket</a><div id="content"></div></main><footer>MedicinGuiden · Utbildningsmaterial · Inga patientuppgifter</footer><script src="./diagnoser.js"></script><script>const d=diagnoses.find(x=>x.id===new URLSearchParams(location.search).get('id'));const root=document.getElementById('content');const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const medications={"hyperk":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/elektrolytrubbningar-syra-bas-vatskebalans/hyperkalemi","items":["Vid EKG-påverkan eller svår hyperkalemi: calciumglukonat 10 %, 20 ml intravenöst på 2–4 minuter enligt regionalt PM; kan behöva upprepas. Sänker INTE kalium.","Kaliumförskjutning: inhalerat salbutamol 5–10 mg under EKG-övervakning. Insulin/glukos ordineras och monitoreras enligt akut-PM, inklusive upprepade glukos- och kaliumkontroller."]},"hypok":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/elektrolytrubbningar-syra-bas-vatskebalans/hypokalemi","items":["Lindrig–måttlig hypokalemi utan symtom: peroral KCl cirka 60–120 mmol/dygn som riktlinjeexempel, med anpassning efter njurfunktion och kontroller.","Vid intravenös substitution anger regionalt PM högst 10 mmol KCl/timme i perifer infart; infusionspump, koncentrationskontroll och uppföljande prover krävs.","Vid samtidig magnesiumbrist behöver även magnesium korrigeras."]},"kol":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/lungsjukdomar/kroniskt-obstruktiv-lungsjukdom-kol---akut-exacerbation","items":["Vid hypoxemi ges kontrollerad syrgas med målsaturation vanligen 88–92 %.","Regionalt PM: nebuliserad salbutamol 4 mg och ipratropium 0,5 mg, kan upprepas utifrån klinik.","Regionalt PM: prednisolon 30 mg peroralt dagligen i 5 dagar. Antibiotika endast vid indikation enligt symtom och lokal resistenspolicy.","NIV övervägs vid hyperkapnisk acidos efter initial behandling."]},"astma":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/lungsjukdomar/astma-bronkiale","items":["Regionalt PM: nebuliserad salbutamol 5–10 mg med ipratropium 0,5 mg vid akut exacerbation; upprepa och övervaka enligt svårighetsgrad.","Regionalt PM: initialt prednisolon 50 mg peroralt; därefter exempelvis 25 mg/dag i 5–10 dagar enligt PM och klinisk bedömning.","Livshotande astma kräver omedelbar kontakt med anestesi/IVA; antibiotika används inte rutinmässigt."]},"avnrt":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/av-nodal-reentrytakykardi-avnrt","items":["Vid stabil regelbunden smal QRS-takykardi: modifierad Valsalva i första hand.","Regionalt PM anger adenosin 5 mg, därefter 10 mg och 15 mg intravenöst snabbt under EKG-övervakning vid behov; kontraindikationer och beredskap kontrolleras.","Vid hemodynamisk påverkan: synkroniserad elkonvertering."]},"svt":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/av-nodal-reentrytakykardi-avnrt","items":["Vid regelbunden smal QRS-takykardi som bedöms AV-nodsberoende: vagala manövrer; adenosin exempelvis 5, 10, 15 mg enligt regional AVNRT-riktlinje, under EKG-övervakning.","Gäller INTE ospecificerade breda eller oregelbundna takykardier. Vid instabilitet övervägs akut elkonvertering."]},"wpw":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/preexitation-wolff-parkinson-white-wpw--takykardi","items":["Vid verifierad ortodrom regelbunden WPW-takykardi finns adenosin 5 + 10 + 15 mg intravenöst som regionalt PM-exempel, med monitorering och beredskap.","VARNING: Oregelbunden bredkomplextakykardi kan vara preexciterat förmaksflimmer: elkonverteringsbedömning omedelbart. Undvik AV-nodblockerande läkemedel som digoxin och verapamil."]},"mobitz1":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Vid symtomgivande bradykardi med cirkulatorisk påverkan: regionalt PM anger atropin 0,5–1 mg intravenöst; kan upprepas efter respons.","Vid svår påverkan eller terapiresistens: pacingberedskap och akut kardiologkontakt."]},"mobitz2":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Högriskblock: akut övervakning och förbered temporär pacing vid påverkan; pacemakerbedömning.","Atropin 0,5–1 mg intravenöst anges i regionalt bradykardi-PM, men effekten kan vara otillräcklig vid infranodalt block."]},"av2":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Klassificera blocket. Vid 2:1-block går Mobitz-typ ofta inte säkert att avgöra från en enstaka rytmremsa.","Symtomgivande bradykardi: atropin 0,5–1 mg intravenöst enligt regionalt PM, men försena inte pacingberedskap vid högriskfynd."]},"av3":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Akut monitorering och pacingberedskap. Regionalt bradykardi-PM anger atropin 0,5–1 mg intravenöst, men totalblock svarar inte alltid.","Bedöm temporär och permanent pacemaker skyndsamt."]},"vt":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/ventrikeltakykardi-vt","items":["Pulslös VT: defibrillering och A-HLR. Instabil VT med puls: synkroniserad elkonvertering.","Regionalt PM anger prokainamid 10 mg/kg intravenöst över 20 minuter som specialistalternativ vid stabil ihållande VT, med betydande kontraindikationer och monitoreringskrav."]},"af":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/formaksflimmer-ff","items":["Vid snabb förmaksflimmerrytm och stabil hemodynamik anger regionalt PM metoprolol 2,5–5 mg långsamt intravenöst under telemetri, med möjlighet till upprepning efter puls och blodtryck.","IV betablockad är inte lämplig vid bland annat hypotoni eller uttalat nedsatt systolisk funktion. Bedöm antikoagulation enligt aktuell tromboembolirisk, duration och konverteringsplan.","Vid hemodynamisk instabilitet med orsakande arytmi: akut synkroniserad elkonvertering."]},"flutter":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/formaksfladder","items":["Regionalt PM anger betablockerare som förstahandsalternativ för frekvenssänkning; dos anpassas individuellt efter cirkulation och kontraindikationer.","Vid instabilitet krävs akut elkonverteringsbedömning; typiskt förmaksfladder kan ofta behandlas definitivt med istmusablation."]},"ves":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/ventrikulara-extrasystolier-ves","items":["Behandling behövs oftast inte vid isolerade ofarliga VES. Undersök strukturhjärtsjukdom vid hög belastning och symtom.","Regionalt PM anger bisoprolol 5–10 mg dagligen eller metoprolol depå 50–200 mg dagligen som möjliga symtomlindrande alternativ, men läkemedelseffekten är ofta begränsad."]}};const sources=[["Internetmedicin – behandlingsöversikter","https://www.internetmedicin.se/"],["Region Stockholm – Akut internmedicin","https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok"],["Medicinakuten – utbildningsöversikt","https://medicinakuten.se/"]];
function modality(d){if(['le','dissektion','aneurysm'].includes(d.id))return [{type:'ct',title:'DT-angiografi',description:'Principbild av tvärsnitt; bedöm kontrastfyllda kärl och riktad frågeställning.'},{type:'us',title:'Ultraljud',description:'Kompletterande metod beroende på kärl, patient och frågeställning.'}];if(['dvt'].includes(d.id))return [{type:'us',title:'Kompressionsultraljud ben',description:'Venen ska kunna komprimeras normalt; avsaknad av kompressibilitet talar för trombos.'}];if(['kol','astma','hf'].includes(d.id))return [{type:'xray',title:'Slätröntgen thorax',description:'Används efter klinisk indikation, t.ex. för differentialdiagnoser eller kongestion.'},{type:'us',title:'Lung-/hjärtultraljud',description:'Kompletterande bedside-undersökning när kompetens finns.'}];if(['endokardit','myokardit','perikardit','af','flutter'].includes(d.id))return [{type:'us',title:'Ekokardiografi',description:'Anatomisk skiss av ultraljud; krävs riktad tolkning i verklig undersökning.'}];return [{type:'xray',title:'Bilddiagnostik vid indikation',description:'Ej rutinmässigt för alla tillstånd. Välj DT, slätröntgen eller ultraljud utifrån frågeställning.'}]}
function scanSVG(type){const common='<rect width="320" height="180" fill="#0b1018"/><rect x="12" y="12" width="296" height="156" rx="12" fill="#171d26" stroke="#4d6578" />';if(type==='ct')return '<svg viewBox="0 0 320 180" role="img" aria-label="Schematiskt DT-tvärsnitt">'+common+'<ellipse cx="160" cy="90" rx="113" ry="68" fill="#65727b" opacity=".43"/><ellipse cx="114" cy="89" rx="49" ry="52" fill="#101923"/><ellipse cx="206" cy="89" rx="49" ry="52" fill="#101923"/><path d="M152 68 Q177 55 188 75 L183 112 L147 110Z" fill="#a1adb4"/><circle cx="171" cy="88" r="11" fill="#dceef6"/><text x="17" y="164" fill="#b3c3ce" font-size="10">SCHEMATISK DT – EJ PATIENTBILD</text></svg>';if(type==='us')return '<svg viewBox="0 0 320 180" role="img" aria-label="Schematiskt ultraljud">'+common+'<path d="M160 29 L48 150 Q160 175 272 150Z" fill="#434b56" stroke="#8a97a3"/><path d="M160 29 L72 149 M160 29 L245 150" stroke="#64717e" opacity=".5"/><ellipse cx="160" cy="113" rx="48" ry="19" fill="#171d26" stroke="#b3c0cb" stroke-width="3"/><ellipse cx="160" cy="113" rx="16" ry="11" fill="#929eaa"/><text x="17" y="164" fill="#b3c3ce" font-size="10">SCHEMATISKT UL – EJ PATIENTBILD</text></svg>';return '<svg viewBox="0 0 320 180" role="img" aria-label="Schematiskt lungröntgen">'+common+'<path d="M156 39 Q127 40 100 56 Q65 74 82 145 Q124 160 151 129Z M164 39 Q194 40 219 56 Q251 74 237 145 Q197 160 169 129Z" fill="#0a131c" stroke="#a2b1bf" stroke-width="3"/><path d="M160 35 L160 132 M83 78 Q160 57 237 78 M81 97 Q160 83 239 97 M84 118 Q160 109 236 118" fill="none" stroke="#9fabb7" opacity=".7" stroke-width="3"/><path d="M158 124 Q172 91 196 114 Q196 143 156 146Z" fill="#788997"/><text x="17" y="164" fill="#b3c3ce" font-size="10">SCHEMATISK RTG – EJ PATIENTBILD</text></svg>'}
if(!d){root.innerHTML='<h1>Diagnosen hittades inte</h1><a href="./index.html">Tillbaka</a>'}else{
document.title=d.title+' | MedicinGuiden';const sections=[['Orsak',d.cause],['Symtom',d.symptoms],['Kliniska fynd',d.clinical],['Provfynd',d.labs],['Utredning',d.workup],['Provtagning',d.tests],['EKG-fynd',d.ecg],['Behandling – principer',d.treatment]];const med=medications[d.id];const imgs=modality(d);const a=d.emergency||{};const emergencySections=[['1. Triage och ABCDE',a.triage],['2. Riktad anamnes',a.anamnes],['3. Kliniskt status',a.status],['4. Provtagning och tidskritiska prover',a.provtagning],['5. Bilddiagnostik – när och varför',a.bilddiagnostik],['6. Fallgropar och differentialdiagnostik',a.fallgropar],['7. Fortsatt plan och vårdnivå',a.plan]];root.innerHTML='<p class="category">'+E(d.category)+'</p><h1>'+E(d.title)+'</h1><div class="notice"><strong>OBS – utbildningsmaterial, ej validerat beslutsstöd.</strong> Uppgifterna är förenklade. Dosexempel avser vuxna med normal njur-/leverfunktion och kräver ordinationskontroll, kontraindikationsbedömning och lokala PM. Mata inte in patientuppgifter.</div><div class="grid">'+sections.map(([name,value])=>'<section class="panel"><h2>'+E(name)+'</h2><p>'+E(value)+'</p></section>').join('')+'</div><section class="panel wide"><p class="category">Medicinsk fördjupning</p><h2>Patofysiologi, diagnostisk tolkning och akuta beslut</h2><div class="grid"><article class="panel"><h3>Patofysiologi och bakomliggande mekanismer</h3><p>'+E(d.deep?.mekanism||d.cause)+'</p></article><article class="panel"><h3>EKG, kliniska kriterier och differentialdiagnostik</h3><p>'+E(d.deep?.tolkning||d.ecg)+'</p></article><article class="panel"><h3>Akut strategi och behandlingsprioritering</h3><p>'+E(d.deep?.akutstrategi||d.treatment)+'</p></article><article class="panel"><h3>Viktiga säkerhetskontroller</h3><p>'+E(a.fallgropar)+'</p></article></div></section><section class="panel wide"><p class="category">Akutmottagning · handläggning</p><h2>Praktisk handläggning steg för steg</h2><p class="subtle">Följ lokalt PM, klinisk prioritet och tillgänglig kompetens. Stegen kan behöva ske parallellt.</p><div class="grid">'+emergencySections.map(([name,value])=>'<article class="panel"><h3>'+E(name)+'</h3><p>'+E(value)+'</p></article>').join('')+'</div></section><section class="panel wide"><h2>Akut handläggningsalgoritm – tabell</h2><div class="tablewrap"><table><thead><tr><th>Steg</th><th>Bedömning / fynd</th><th>Åtgärd</th></tr></thead><tbody><tr><td>1. Triage</td><td>ABCDE, vitalparametrar, chock, hjärtstopp, hypoxemi eller annan instabilitet</td><td>'+E(a.triage)+'</td></tr><tr><td>2. Akut beslut</td><td>'+E(d.symptoms)+'; '+E(d.clinical)+'</td><td>'+E(a.atgard)+'</td></tr><tr><td>3. Diagnostik</td><td>'+E(d.ecg)+'; '+E(d.labs)+'</td><td>'+E(a.provtagning)+' '+E(a.bilddiagnostik)+'</td></tr><tr><td>4. Behandling</td><td>Behandlingssvar, blodtryck, puls, saturation, medvetande och eventuella nya symtom</td><td>'+E(d.treatment)+'</td></tr><tr><td>5. Omvärdering</td><td>Upprepa status, vitalparametrar och relevanta prover/EKG</td><td>'+E(a.plan)+'</td></tr></tbody></table></div></section><section class="panel wide"><h2>Akut läkemedelsbehandling enligt angivna källor</h2>'+(a.dose?'<p>'+E(a.dose)+'</p><p><a target="_blank" rel="noopener noreferrer" href="'+E(a.source)+'">Läs regionalt behandlings-PM</a></p>':'<p>Behandlingsprincip: '+E(d.treatment)+'. För detaljerade läkemedelsdoser och administrationssätt, se behandlingsöversikterna nedan. Doser som inte finns dokumenterade i projektets källunderlag har inte lagts till.</p>')+'</section><section class="panel wide"><h2>EKG-bild – egenritad schematisk rytmremsa</h2><p class="subtle">Pedagogisk illustration, inte ett verkligt patient-EKG eller ett diagnostiskt 12-avlednings-EKG. För vissa diagnoser finns inget specifikt EKG-fynd.</p><svg class="ecg" id="ecg" viewBox="0 0 840 230" role="img" aria-label="Schematisk EKG-illustration"></svg></section><section class="panel wide"><h2>DT, slätröntgen och ultraljud</h2><p class="subtle">Bilderna nedan är egenritade anatomiska principskisser, inte riktiga röntgen-/ultraljudsfynd. Det betyder inte att varje modalitet är indicerad för diagnosen.</p><div class="imaging">'+imgs.map(x=>'<div class="scan">'+scanSVG(x.type)+'<h3>'+E(x.title)+'</h3><p>'+E(x.description)+'</p></div>').join('')+'</div></section><section class="panel wide"><h2>Behandlingsplan och dosering från källorna</h2>'+(med?'<p class="subtle">Behandlingsuppgifter hämtade ur det angivna regionala kunskapsstödet. Kontrollera aktuell version, patientfaktorer och kontraindikationer före ordination.</p><ul class="doselist">'+med.items.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><p><a href="'+med.source+'" target="_blank" rel="noopener noreferrer">Kontrollera original-PM för dos, beredning och kontraindikationer</a></p>':'<p>Läkemedelsplanen ovan beskriver behandlingsprinciper. Exakt dos och administreringssätt saknas ännu i det inlästa källunderlaget för denna diagnos. Öppna originalkällan för ordinationsuppgifter.</p>')+'</section><section class="panel wide"><h2>Behandlingsalgoritm – tabell</h2><div class="tablewrap"><table><thead><tr><th>Symtom</th><th>Fynd</th><th>Utredning</th><th>Behandling</th></tr></thead><tbody><tr><td>'+E(d.symptoms)+'</td><td>'+E(d.clinical)+'; '+E(d.ecg)+'</td><td>'+E(d.workup)+'; '+E(d.tests)+'</td><td>'+E(d.treatment)+'</td></tr></tbody></table></div></section><section class="panel wide"><h2>Källor</h2><p class="subtle">Endast de angivna tre källorna används som referensportaler. När ett särskilt dosavsnitt är verifierat länkas den specifika sidan direkt. Övriga kliniska sammanfattningar har inte granskats påståenderad för påståenderad.</p><ul class="ref">'+sources.map(([name,url])=>'<li><a target="_blank" rel="noopener noreferrer" href="'+url+'">'+E(name)+'</a></li>').join('')+'</ul><p class="subtle">Granskningsstatus: innehållet är preliminärt och behöver läkarsakkunnig granskning före kliniskt bruk. Uppdaterad kod 2026-11-12.</p></section>';draw()}

function pWave(x,amp=10){path+=' M'+x+' '+y+' Q'+(x+8)+' '+(y-amp*1.8)+' '+(x+19)+' '+y}
function qrs(x,type='normal'){if(type==='wide'){path+=' M'+x+' '+y+' L'+(x+8)+' '+(y+5)+' L'+(x+20)+' '+(y-52)+' L'+(x+30)+' '+(y-52)+' L'+(x+37)+' '+(y-43)+' L'+(x+45)+' '+(y+13)+' L'+(x+56)+' '+y;return 56}if(type==='rbbb'){path+=' M'+x+' '+y+' L'+(x+6)+' '+(y+6)+' L'+(x+13)+' '+(y-44)+' L'+(x+20)+' '+(y+22)+' L'+(x+32)+' '+(y-55)+' L'+(x+42)+' '+(y+5)+' L'+(x+52)+' '+y;return 52}if(type==='lbbb'){path+=' M'+x+' '+y+' L'+(x+11)+' '+(y+7)+' L'+(x+20)+' '+(y-45)+' L'+(x+30)+' '+(y-52)+' L'+(x+39)+' '+(y-45)+' L'+(x+47)+' '+(y+8)+' L'+(x+57)+' '+y;return 57}if(type==='wpw'){path+=' M'+x+' '+y+' Q'+(x+12)+' '+(y-10)+' '+(x+20)+' '+(y-32)+' L'+(x+25)+' '+(y-57)+' L'+(x+32)+' '+(y+23)+' L'+(x+39)+' '+y;return 39}path+=' M'+x+' '+y+' L'+(x+5)+' '+(y+7)+' L'+(x+12)+' '+(y-60)+' L'+(x+20)+' '+(y+22)+' L'+(x+28)+' '+y;return 28}
function tWave(x,kind='normal'){if(kind==='peaked'){path+=' M'+x+' '+y+' L'+(x+16)+' '+(y-45)+' L'+(x+32)+' '+y;return}if(kind==='flat'){path+=' M'+x+' '+y+' Q'+(x+13)+' '+(y-7)+' '+(x+28)+' '+y+' Q'+(x+36)+' '+(y-22)+' '+(x+44)+' '+y;return}path+=' M'+x+' '+y+' Q'+(x+14)+' '+(y-29)+' '+(x+29)+' '+y}
function beat(x,opts={}){const q=x+(opts.pr??43);if(opts.p!==false)pWave(x);if(opts.drop){line(x+20,y,x+133,y);return}const width=qrs(q,opts.qrs||'normal');if(opts.st==='up'){path+=' M'+(q+width)+' '+y+' Q'+(q+width+15)+' '+(y-23)+' '+(q+width+32)+' '+(y-18)+' L'+(q+width+49)+' '+(y-17);tWave(q+width+49)}else if(opts.st==='down'){path+=' M'+(q+width)+' '+y+' L'+(q+width+12)+' '+(y+15)+' L'+(q+width+35)+' '+(y+15);tWave(q+width+35)}else tWave(q+width+12,opts.t||'normal');}
if(pattern==='vf'){let y0=120;for(let x=0;x<=840;x+=5){let yn=120+22*Math.sin(x*.12)+13*Math.sin(x*.34)+7*Math.sin(x*.58);line(x,y0,x+5,yn);y0=yn}}
else if(pattern==='af'){const xs=[20,130,223,368,456,596,710];for(let x=0;x<840;x+=5){const v=y+3*Math.sin(x*.28)+2*Math.cos(x*.67);line(x,v,x+5,y+3*Math.sin((x+5)*.28)+2*Math.cos((x+5)*.67))}for(const x of xs){qrs(x,'normal');tWave(x+42)}}
else if(pattern==='flutter'){for(let x=5;x<840;x+=21)path+=' M'+x+' '+y+' L'+(x+9)+' '+(y-18)+' L'+(x+19)+' '+y;for(const x of [70,225,380,535,690]){qrs(x)}}
else if(pattern==='av3'){for(let x=22;x<830;x+=110)pWave(x);for(let x=100;x<830;x+=228){qrs(x,'wide');tWave(x+75)}}
else if(pattern==='mobitz1'){[45,195,345,495,645].forEach((x,i)=>beat(x,{pr:46+i*12,drop:i===3}));}
else if(pattern==='mobitz2'){[35,195,355,515,675].forEach((x,i)=>beat(x,{pr:55,drop:i===2}));}
else if(pattern==='av2'){[35,195,355,515,675].forEach((x,i)=>beat(x,{pr:55,drop:i%2===1}));}
else if(pattern==='vt'){[20,154,288,422,556,690].forEach(x=>{qrs(x,'wide');line(x+66,y,x+124,y)})}
else if(pattern==='ves'){[15,175,335,495,655].forEach((x,i)=>beat(x,i===2?{p:false,qrs:'wide',pr:0}:{}))}
else if(pattern==='hyperk'){[15,170,325,480,635].forEach(x=>beat(x,{t:'peaked'}))}
else if(pattern==='hypok'){[15,170,325,480,635].forEach(x=>beat(x,{t:'flat'}))}
else if(pattern==='lbbb'||pattern==='rbbb'){[15,185,355,525,695].forEach(x=>beat(x,{qrs:pattern==='lbbb'?'lbbb':'rbbb'}))}
else if(pattern==='wpw'){[15,175,335,495,655].forEach(x=>beat(x,{pr:25,qrs:'wpw'}))}
else if(pattern==='av1'){[15,175,335,495,655].forEach(x=>beat(x,{pr:85}))}
else if(pattern==='stemi'||pattern==='ischemia'||pattern==='pericarditis'){[15,175,335,495,655].forEach(x=>beat(x,{st:pattern==='ischemia'?'down':'up'}))}
else if(pattern==='svt'||pattern==='tachy'){for(let x=5;x<825;x+=110)beat(x,{p:pattern==='tachy',pr:32})}
else{[15,175,335,495,655].forEach(x=>beat(x))}
add('path',{d:path,fill:'none',stroke:'#182c37','stroke-width':2.6,'stroke-linejoin':'round','stroke-linecap':'round'});
const text=add('text',{x:12,y:20,fill:'#39434b','font-size':12,'font-weight':'bold'});text.textContent='SYNTHETISK PRINCIPBILD – EJ PATIENT-EKG';
}</script></body></html>
