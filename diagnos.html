<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnos | MedicinGuiden</title><style>:root{font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:#071525;color:#e8f1fa}*{box-sizing:border-box}body{margin:0;line-height:1.6}a{color:#6adccc}header{background:#0c1c30;border-bottom:1px solid #29425a;padding:18px 5%}header a{text-decoration:none;font-weight:800;font-size:22px}main{max-width:1100px;margin:auto;padding:26px 20px 65px}h1{font-size:clamp(30px,5vw,44px);margin:7px 0 14px}h2{font-size:21px}h3{font-size:16px}.category{color:#6cdccc;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}.muted{color:#b0c3d6}.notice{background:#30271c;border:1px solid #85643e;padding:15px;border-radius:12px;margin:21px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#11243a;border:1px solid #304b65;border-radius:14px;padding:21px}.panel p{color:#c0d0df}.panel h2{margin:0 0 10px}.wide{margin-top:17px}.subtle{font-size:13px;color:#adbdcc}.ecg{width:100%;background:white;border-radius:10px;margin:14px 0;display:block;max-height:300px}.imaging{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.scan{border:1px solid #35506a;border-radius:12px;padding:14px;background:#0a1828}.scan svg{width:100%;height:175px;display:block;border-radius:9px;background:#0a111a}.scan h3{margin:9px 0 4px}.scan p{font-size:12px;margin:0;color:#abbccc}.tablewrap{overflow:auto;border:1px solid #304b65;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px;vertical-align:top;border-bottom:1px solid #304b65;text-align:left}th{background:#19364e;color:#ddf5ef}td{background:#102339}.ref li{margin-bottom:10px}.doselist li{margin:6px 0}.btnlink{display:inline-block;background:#174d52;padding:8px 13px;border-radius:8px;margin-bottom:15px;text-decoration:none}footer{border-top:1px solid #29425a;color:#95aac1;text-align:center;padding:24px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px 13px 55px}}@media print{body{background:#fff;color:#111}header,footer,.btnlink{display:none}.panel,td{background:white;color:black;border-color:#aaa}.muted,.subtle{color:#444}}</style></head><body><header><a href="./index.html">✚ MedicinGuiden</a></header><main><a class="btnlink" href="./index.html">← Till diagnosbiblioteket</a><div id="content"></div></main><footer>MedicinGuiden · Utbildningsmaterial · Inga patientuppgifter</footer><script src="./diagnoser.js"></script><script>const d=diagnoses.find(x=>x.id===new URLSearchParams(location.search).get('id'));const root=document.getElementById('content');const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const medications={"hyperk":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/elektrolytrubbningar-syra-bas-vatskebalans/hyperkalemi","items":["Vid EKG-påverkan eller svår hyperkalemi: calciumglukonat 10 %, 20 ml intravenöst på 2–4 minuter enligt regionalt PM; kan behöva upprepas. Sänker INTE kalium.","Kaliumförskjutning: inhalerat salbutamol 5–10 mg under EKG-övervakning. Insulin/glukos ordineras och monitoreras enligt akut-PM, inklusive upprepade glukos- och kaliumkontroller."]},"hypok":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/elektrolytrubbningar-syra-bas-vatskebalans/hypokalemi","items":["Lindrig–måttlig hypokalemi utan symtom: peroral KCl cirka 60–120 mmol/dygn som riktlinjeexempel, med anpassning efter njurfunktion och kontroller.","Vid intravenös substitution anger regionalt PM högst 10 mmol KCl/timme i perifer infart; infusionspump, koncentrationskontroll och uppföljande prover krävs.","Vid samtidig magnesiumbrist behöver även magnesium korrigeras."]},"kol":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/lungsjukdomar/kroniskt-obstruktiv-lungsjukdom-kol---akut-exacerbation","items":["Vid hypoxemi ges kontrollerad syrgas med målsaturation vanligen 88–92 %.","Regionalt PM: nebuliserad salbutamol 4 mg och ipratropium 0,5 mg, kan upprepas utifrån klinik.","Regionalt PM: prednisolon 30 mg peroralt dagligen i 5 dagar. Antibiotika endast vid indikation enligt symtom och lokal resistenspolicy.","NIV övervägs vid hyperkapnisk acidos efter initial behandling."]},"astma":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/lungsjukdomar/astma-bronkiale","items":["Regionalt PM: nebuliserad salbutamol 5–10 mg med ipratropium 0,5 mg vid akut exacerbation; upprepa och övervaka enligt svårighetsgrad.","Regionalt PM: initialt prednisolon 50 mg peroralt; därefter exempelvis 25 mg/dag i 5–10 dagar enligt PM och klinisk bedömning.","Livshotande astma kräver omedelbar kontakt med anestesi/IVA; antibiotika används inte rutinmässigt."]},"avnrt":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/av-nodal-reentrytakykardi-avnrt","items":["Vid stabil regelbunden smal QRS-takykardi: modifierad Valsalva i första hand.","Regionalt PM anger adenosin 5 mg, därefter 10 mg och 15 mg intravenöst snabbt under EKG-övervakning vid behov; kontraindikationer och beredskap kontrolleras.","Vid hemodynamisk påverkan: synkroniserad elkonvertering."]},"svt":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/av-nodal-reentrytakykardi-avnrt","items":["Vid regelbunden smal QRS-takykardi som bedöms AV-nodsberoende: vagala manövrer; adenosin exempelvis 5, 10, 15 mg enligt regional AVNRT-riktlinje, under EKG-övervakning.","Gäller INTE ospecificerade breda eller oregelbundna takykardier. Vid instabilitet övervägs akut elkonvertering."]},"wpw":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/preexitation-wolff-parkinson-white-wpw--takykardi","items":["Vid verifierad ortodrom regelbunden WPW-takykardi finns adenosin 5 + 10 + 15 mg intravenöst som regionalt PM-exempel, med monitorering och beredskap.","VARNING: Oregelbunden bredkomplextakykardi kan vara preexciterat förmaksflimmer: elkonverteringsbedömning omedelbart. Undvik AV-nodblockerande läkemedel som digoxin och verapamil."]},"mobitz1":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Vid symtomgivande bradykardi med cirkulatorisk påverkan: regionalt PM anger atropin 0,5–1 mg intravenöst; kan upprepas efter respons.","Vid svår påverkan eller terapiresistens: pacingberedskap och akut kardiologkontakt."]},"mobitz2":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Högriskblock: akut övervakning och förbered temporär pacing vid påverkan; pacemakerbedömning.","Atropin 0,5–1 mg intravenöst anges i regionalt bradykardi-PM, men effekten kan vara otillräcklig vid infranodalt block."]},"av2":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Klassificera blocket. Vid 2:1-block går Mobitz-typ ofta inte säkert att avgöra från en enstaka rytmremsa.","Symtomgivande bradykardi: atropin 0,5–1 mg intravenöst enligt regionalt PM, men försena inte pacingberedskap vid högriskfynd."]},"av3":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/bradykardi-av-block-och-grenblock","items":["Akut monitorering och pacingberedskap. Regionalt bradykardi-PM anger atropin 0,5–1 mg intravenöst, men totalblock svarar inte alltid.","Bedöm temporär och permanent pacemaker skyndsamt."]},"vt":{"source":"https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok/kardiologi---arytmier/ventrikeltakykardi-vt","items":["Pulslös VT: defibrillering och A-HLR. Instabil VT med puls: synkroniserad elkonvertering.","Regionalt PM anger prokainamid 10 mg/kg intravenöst över 20 minuter som specialistalternativ vid stabil ihållande VT, med betydande kontraindikationer och monitoreringskrav."]}};const sources=[["Internetmedicin – behandlingsöversikter","https://www.internetmedicin.se/"],["Region Stockholm – Akut internmedicin","https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok"],["Medicinakuten – utbildningsöversikt","https://medicinakuten.se/"]];
function modality(d){if(['le','dissektion','aneurysm'].includes(d.id))return [{type:'ct',title:'DT-angiografi',description:'Principbild av tvärsnitt; bedöm kontrastfyllda kärl och riktad frågeställning.'},{type:'us',title:'Ultraljud',description:'Kompletterande metod beroende på kärl, patient och frågeställning.'}];if(['dvt'].includes(d.id))return [{type:'us',title:'Kompressionsultraljud ben',description:'Venen ska kunna komprimeras normalt; avsaknad av kompressibilitet talar för trombos.'}];if(['kol','astma','hf'].includes(d.id))return [{type:'xray',title:'Slätröntgen thorax',description:'Används efter klinisk indikation, t.ex. för differentialdiagnoser eller kongestion.'},{type:'us',title:'Lung-/hjärtultraljud',description:'Kompletterande bedside-undersökning när kompetens finns.'}];if(['endokardit','myokardit','perikardit','af','flutter'].includes(d.id))return [{type:'us',title:'Ekokardiografi',description:'Anatomisk skiss av ultraljud; krävs riktad tolkning i verklig undersökning.'}];return [{type:'xray',title:'Bilddiagnostik vid indikation',description:'Ej rutinmässigt för alla tillstånd. Välj DT, slätröntgen eller ultraljud utifrån frågeställning.'}]}
function scanSVG(type){const common='<rect width="320" height="180" fill="#0b1018"/><rect x="12" y="12" width="296" height="156" rx="12" fill="#171d26" stroke="#4d6578" />';if(type==='ct')return '<svg viewBox="0 0 320 180" role="img" aria-label="Schematiskt DT-tvärsnitt">'+common+'<ellipse cx="160" cy="90" rx="113" ry="68" fill="#65727b" opacity=".43"/><ellipse cx="114" cy="89" rx="49" ry="52" fill="#101923"/><ellipse cx="206" cy="89" rx="49" ry="52" fill="#101923"/><path d="M152 68 Q177 55 188 75 L183 112 L147 110Z" fill="#a1adb4"/><circle cx="171" cy="88" r="11" fill="#dceef6"/><text x="17" y="164" fill="#b3c3ce" font-size="10">SCHEMATISK DT – EJ PATIENTBILD</text></svg>';if(type==='us')return '<svg viewBox="0 0 320 180" role="img" aria-label="Schematiskt ultraljud">'+common+'<path d="M160 29 L48 150 Q160 175 272 150Z" fill="#434b56" stroke="#8a97a3"/><path d="M160 29 L72 149 M160 29 L245 150" stroke="#64717e" opacity=".5"/><ellipse cx="160" cy="113" rx="48" ry="19" fill="#171d26" stroke="#b3c0cb" stroke-width="3"/><ellipse cx="160" cy="113" rx="16" ry="11" fill="#929eaa"/><text x="17" y="164" fill="#b3c3ce" font-size="10">SCHEMATISKT UL – EJ PATIENTBILD</text></svg>';return '<svg viewBox="0 0 320 180" role="img" aria-label="Schematiskt lungröntgen">'+common+'<path d="M156 39 Q127 40 100 56 Q65 74 82 145 Q124 160 151 129Z M164 39 Q194 40 219 56 Q251 74 237 145 Q197 160 169 129Z" fill="#0a131c" stroke="#a2b1bf" stroke-width="3"/><path d="M160 35 L160 132 M83 78 Q160 57 237 78 M81 97 Q160 83 239 97 M84 118 Q160 109 236 118" fill="none" stroke="#9fabb7" opacity=".7" stroke-width="3"/><path d="M158 124 Q172 91 196 114 Q196 143 156 146Z" fill="#788997"/><text x="17" y="164" fill="#b3c3ce" font-size="10">SCHEMATISK RTG – EJ PATIENTBILD</text></svg>'}
if(!d){root.innerHTML='<h1>Diagnosen hittades inte</h1><a href="./index.html">Tillbaka</a>'}else{
document.title=d.title+' | MedicinGuiden';const sections=[['Orsak',d.cause],['Symtom',d.symptoms],['Kliniska fynd',d.clinical],['Provfynd',d.labs],['Utredning',d.workup],['Provtagning',d.tests],['EKG-fynd',d.ecg],['Behandling – principer',d.treatment]];const med=medications[d.id];const imgs=modality(d);root.innerHTML='<p class="category">'+E(d.category)+'</p><h1>'+E(d.title)+'</h1><div class="notice"><strong>OBS – utbildningsmaterial, ej validerat beslutsstöd.</strong> Uppgifterna är förenklade. Dosexempel avser vuxna med normal njur-/leverfunktion och kräver ordinationskontroll, kontraindikationsbedömning och lokala PM. Mata inte in patientuppgifter.</div><div class="grid">'+sections.map(([name,value])=>'<section class="panel"><h2>'+E(name)+'</h2><p>'+E(value)+'</p></section>').join('')+'</div><section class="panel wide"><h2>EKG-bild – egenritad schematisk rytmremsa</h2><p class="subtle">Pedagogisk illustration, inte ett verkligt patient-EKG eller ett diagnostiskt 12-avlednings-EKG. För vissa diagnoser finns inget specifikt EKG-fynd.</p><svg class="ecg" id="ecg" viewBox="0 0 840 230" role="img" aria-label="Schematisk EKG-illustration"></svg></section><section class="panel wide"><h2>DT, slätröntgen och ultraljud</h2><p class="subtle">Bilderna nedan är egenritade anatomiska principskisser, inte riktiga röntgen-/ultraljudsfynd. Det betyder inte att varje modalitet är indicerad för diagnosen.</p><div class="imaging">'+imgs.map(x=>'<div class="scan">'+scanSVG(x.type)+'<h3>'+E(x.title)+'</h3><p>'+E(x.description)+'</p></div>').join('')+'</div></section><section class="panel wide"><h2>Läkemedel och verifierade doserings­exempel</h2>'+(med?'<p class="subtle">Dessa exempel har kontrollerats mot den direktlänkade regionala kunskapssidan. De utgör inte en fullständig ordination.</p><ul class="doselist">'+med.items.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><p><a href="'+med.source+'" target="_blank" rel="noopener noreferrer">Kontrollera original-PM för dos, beredning och kontraindikationer</a></p>':'<p>Ingen diagnosspecifik läkemedelsdos publiceras här ännu, eftersom en aktuell dos, beredningsform och kontraindikationskontroll inte har verifierats för just denna diagnos. Se källorna före ordination.</p>')+'</section><section class="panel wide"><h2>Behandlingsalgoritm – tabell</h2><div class="tablewrap"><table><thead><tr><th>Symtom</th><th>Fynd</th><th>Utredning</th><th>Behandling</th></tr></thead><tbody><tr><td>'+E(d.symptoms)+'</td><td>'+E(d.clinical)+'; '+E(d.ecg)+'</td><td>'+E(d.workup)+'; '+E(d.tests)+'</td><td>'+E(d.treatment)+'</td></tr></tbody></table></div></section><section class="panel wide"><h2>Källor</h2><p class="subtle">Endast de angivna tre källorna används som referensportaler. När ett särskilt dosavsnitt är verifierat länkas den specifika sidan direkt. Övriga kliniska sammanfattningar har inte granskats påståenderad för påståenderad.</p><ul class="ref">'+sources.map(([name,url])=>'<li><a target="_blank" rel="noopener noreferrer" href="'+url+'">'+E(name)+'</a></li>').join('')+'</ul><p class="subtle">Granskningsstatus: innehållet är preliminärt och behöver läkarsakkunnig granskning före kliniskt bruk. Uppdaterad kod 2026-11-12.</p></section>';draw()}
function draw(){const svg=document.getElementById('ecg');const ns='http://www.w3.org/2000/svg';const el=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e};el('rect',{width:840,height:230,fill:'#fff'});for(let x=0;x<=840;x+=10)el('line',{x1:x,y1:0,x2:x,y2:230,stroke:x%50===0?'#efb3bc':'#f9dce0','stroke-width':x%50===0?1:.5});for(let y=0;y<=230;y+=10)el('line',{x1:0,y1:y,x2:840,y2:y,stroke:y%50===0?'#efb3bc':'#f9dce0','stroke-width':y%50===0?1:.5});
const pattern=d.pattern;let points=[];const add=(x,y)=>points.push([x,y]);const beats=pattern==='tachy'||pattern==='svt'||pattern==='avnrt'?8:pattern==='vt'?6:pattern==='af'?7:pattern==='flutter'?5:pattern==='vf'?0:pattern==='av3'?4:5;const base=118;
if(pattern==='vf'){for(let x=10;x<830;x+=4)add(x,base+Math.sin(x*.14)*20+Math.sin(x*.39)*13)}else{let x=15;for(let i=0;i<beats;i++){const span=pattern==='af'?[124,82,140,96,110,86,120][i]:pattern==='tachy'||pattern==='svt'?103:pattern==='vt'?134:158;const amp=pattern==='vt'?75:65;add(x,base);if(pattern==='flutter'){for(let j=0;j<4;j++){add(x+j*25,base);add(x+j*25+10,base-15);add(x+j*25+19,base+1)}}else if(pattern!=='af'&&pattern!=='vt'){add(x+19,base);add(x+26,base-11);add(x+34,base)}let q=x+(pattern==='mobitz1'&&i===3?145:pattern==='mobitz2'&&i===2?140:pattern==='av2'&&i===2?140:pattern==='av1'?85:pattern==='lbbb'?74:pattern==='rbbb'?74:60);if((pattern==='mobitz1'&&i===3)||(pattern==='mobitz2'&&i===2)||(pattern==='av2'&&i===2)){add(x+span-4,base)}else{add(q-10,base);add(q,base+9);add(q+8,base-amp);add(q+18,base+22);add(q+28,base);if(pattern==='wpw')add(q-22,base-14);if(pattern==='hyperk'){add(q+47,base);add(q+60,base-39);add(q+73,base)}else if(pattern==='hypok'){add(q+47,base);add(q+60,base-5);add(q+73,base);add(q+87,base-15);add(q+97,base)}else{add(q+46,base);add(q+59,base-17);add(q+74,base)}}add(x+span-3,base);x+=span;if(x>830)break}}
const path=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');el('path',{d:path,fill:'none',stroke:'#192b36','stroke-width':2.5,'stroke-linecap':'round','stroke-linejoin':'round'});const txt=document.createElementNS(ns,'text');txt.setAttribute('x',14);txt.setAttribute('y',20);txt.setAttribute('font-size',12);txt.setAttribute('fill','#344');txt.textContent='SCHEMATISK ILLUSTRATION – EJ PATIENT-EKG';svg.append(txt)}
</script></body></html>
