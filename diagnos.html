<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnos | MedicinGuiden</title><style>
:root{font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:#071525;color:#e8f1fa}*{box-sizing:border-box}body{margin:0;line-height:1.6}a{color:#7be3d5}header{background:#0c1c30;border-bottom:1px solid #29425a;padding:18px 5%}header a{text-decoration:none;font-weight:800;font-size:22px}main{max-width:1040px;margin:auto;padding:30px 20px 70px}h1{font-size:clamp(29px,5vw,43px);margin:5px 0 12px}h2{font-size:23px;margin:0 0 12px}.category{color:#6cdccc;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}.muted{color:#b0c3d6}.notice{background:#30271c;border:1px solid #85643e;padding:15px;border-radius:12px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#11243a;border:1px solid #304b65;border-radius:14px;padding:22px}.panel p{color:#c0d0df;margin-bottom:0}.panel h2{font-size:19px}.wide{margin-top:16px}.ecg{width:100%;background:#fff;border-radius:10px;display:block;margin:15px 0}.flow{display:grid;gap:12px;justify-items:center}.node{background:#19314a;border:1px solid #466b83;border-radius:14px;padding:23px;text-align:center;width:100%;max-width:690px}.node h3{font-size:20px;line-height:1.45}.node.result{background:#16403e;border-color:#56a99b}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 25px;font:inherit;color:white;font-weight:700;cursor:pointer}.yes{background:#117e74}.no{background:#375f8b}.reset{background:#40556e}.trail{color:#a5b9cb;font-size:13px}.refs li{margin-bottom:10px}.subtle{font-size:12px;color:#9aafc3}footer{text-align:center;color:#93a8bc;border-top:1px solid #30465c;padding:20px;font-size:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><header><a href="./index.html">✚ MedicinGuiden</a></header><main><a href="./index.html">← Tillbaka till diagnoser</a><div id="content"></div></main><footer>MedicinGuiden · Utbildningsmaterial · Inga patientuppgifter</footer><script src="./diagnoser.js"></script><script>
const d=diagnoses.find(x=>x.id===new URLSearchParams(location.search).get('id'));const root=document.getElementById('content');const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));const sources=[['Internetmedicin','https://www.internetmedicin.se/'],['Akut internmedicin – Kunskapsstöd för vårdgivare','https://kunskapsstodforvardgivare.se/omraden/akut-vard/regionala-kunskapsstod/akut-internmedicin-behandlingshandbok'],['Medicinakuten','https://medicinakuten.se/']];
if(!d){root.innerHTML='<h1>Diagnosen hittades inte</h1>'}else{document.title=d.title+' | MedicinGuiden';const sections=[['Orsak',d.cause],['Symtom',d.symptoms],['Kliniska fynd',d.clinical],['Provfynd',d.labs],['Utredning',d.workup],['Provtagning',d.tests],['EKG-fynd',d.ecg],['Behandling',d.treatment]];root.innerHTML='<p class="category" style="margin-top:24px">'+E(d.category)+'</p><h1>'+E(d.title)+'</h1><div class="notice">⚠ Förenklad utbildningsöversikt. Ej individuellt medicinskt granskad eller validerad för kliniska beslut. Följ lokala vårdprogram, aktuella riktlinjer och specialiststöd vid akuta tillstånd.</div><div class="grid">'+sections.map(([name,value])=>'<section class="panel"><h2>'+E(name)+'</h2><p>'+E(value)+'</p></section>').join('')+'</div><section class="panel wide"><h2>EKG – schematisk illustration</h2><p class="subtle">Pedagogisk syntetisk rytmremsa, INTE ett riktigt patient-EKG eller ett diagnostiskt 12-avlednings-EKG. Endast principbild; vissa tillstånd saknar specifikt EKG-mönster.</p><svg class="ecg" id="ecg" viewBox="0 0 840 230" role="img" aria-label="Schematisk EKG-illustration"></svg><p class="subtle">'+E(d.ecg)+'</p></section><section class="panel wide"><h2>Interaktiv handläggningsalgoritm</h2><p class="muted">Välj JA eller NEJ. Förenklad pedagogisk prioritering – ersätter inte kliniskt omdöme.</p><div id="flow" class="flow"></div><p id="trail" class="trail"></p></section><section class="panel wide"><h2>Källor och referenser</h2><p>De tre önskade källorna finns länkade nedan. Länkarna går till respektive kunskapsportal och innebär inte att varje diagnosuppgift har verifierats mot en specifik artikel.</p><ul class="refs">'+sources.map(([name,url])=>'<li><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+E(name)+'</a></li>').join('')+'</ul><p class="subtle">Källstatus: portallänkar, ej artikelverifierade. Granskningsstatus: ej medicinskt faktagranskad. Kodversion: november 2026.</p></section>';draw();render()}
function draw(){const svg=document.getElementById('ecg');const ns='http://www.w3.org/2000/svg';const el=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e};el('rect',{width:840,height:230,fill:'#fff'});for(let x=0;x<=840;x+=10)el('line',{x1:x,y1:0,x2:x,y2:230,stroke:x%50===0?'#efb3bc':'#f9dce0','stroke-width':x%50===0?1:.5});for(let y=0;y<=230;y+=10)el('line',{x1:0,y1:y,x2:840,y2:y,stroke:y%50===0?'#efb3bc':'#f9dce0','stroke-width':y%50===0?1:.5});
const pattern=d.pattern;let points=[];const add=(x,y)=>points.push([x,y]);const beats=pattern==='tachy'||pattern==='svt'||pattern==='avnrt'?8:pattern==='vt'?6:pattern==='af'?7:pattern==='flutter'?5:pattern==='vf'?0:pattern==='av3'?4:5;const base=118;
if(pattern==='vf'){for(let x=10;x<830;x+=4)add(x,base+Math.sin(x*.14)*20+Math.sin(x*.39)*13)}else{let x=15;for(let i=0;i<beats;i++){const span=pattern==='af'?[124,82,140,96,110,86,120][i]:pattern==='tachy'||pattern==='svt'?103:pattern==='vt'?134:158;const amp=pattern==='vt'?75:65;add(x,base);if(pattern==='flutter'){for(let j=0;j<4;j++){add(x+j*25,base);add(x+j*25+10,base-15);add(x+j*25+19,base+1)}}else if(pattern!=='af'&&pattern!=='vt'){add(x+19,base);add(x+26,base-11);add(x+34,base)}let q=x+(pattern==='mobitz1'&&i===3?145:pattern==='mobitz2'&&i===2?140:pattern==='av2'&&i===2?140:pattern==='av1'?85:pattern==='lbbb'?74:pattern==='rbbb'?74:60);if((pattern==='mobitz1'&&i===3)||(pattern==='mobitz2'&&i===2)||(pattern==='av2'&&i===2)){add(x+span-4,base)}else{add(q-10,base);add(q,base+9);add(q+8,base-amp);add(q+18,base+22);add(q+28,base);if(pattern==='wpw')add(q-22,base-14);if(pattern==='hyperk'){add(q+47,base);add(q+60,base-39);add(q+73,base)}else if(pattern==='hypok'){add(q+47,base);add(q+60,base-5);add(q+73,base);add(q+87,base-15);add(q+97,base)}else{add(q+46,base);add(q+59,base-17);add(q+74,base)}}add(x+span-3,base);x+=span;if(x>830)break}}
const path=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');el('path',{d:path,fill:'none',stroke:'#192b36','stroke-width':2.5,'stroke-linecap':'round','stroke-linejoin':'round'});const txt=document.createElementNS(ns,'text');txt.setAttribute('x',14);txt.setAttribute('y',20);txt.setAttribute('font-size',12);txt.setAttribute('fill','#344');txt.textContent='SCHEMATISK ILLUSTRATION – EJ PATIENT-EKG';svg.append(txt)}
let step=0;let answers=[];const scenarios=[{q:'Finns akut cirkulations- eller andningspåverkan, synkope, pågående svår bröstsmärta eller annan instabilitet?',yes:3,no:1},{q:'Finns fynd som talar för diagnosen vid riktad anamnes, status och EKG/undersökning?',yes:2,no:4},{q:'Behöver patienten akut specialistbedömning, övervakning eller sjukhusvård?',yes:5,no:6},{result:'Akut ABCDE, monitorering, larma senior/akutteam och behandla livshotande tillstånd utan fördröjning enligt lokalt PM.'},{result:'Ompröva differentialdiagnoser. Fortsätt riktad utredning och ny riskbedömning vid försämring.'},{result:'Kontakta relevant jour, säkra monitorering och fortsätt diagnosspecifik behandling enligt aktuellt vårdprogram.'},{result:'Planera fortsatt utredning, behandling och uppföljning enligt klinisk risk och lokala riktlinjer.'}];
function render(){const node=scenarios[step],host=document.getElementById('flow');host.replaceChildren();const box=document.createElement('div');box.className='node'+(node.result?' result':'');const title=document.createElement('h3');title.textContent=node.q||node.result;box.append(title);const row=document.createElement('div');row.className='choices';if(node.q){[['JA','yes'],['NEJ','no']].forEach(([label,key])=>{const b=document.createElement('button');b.className=key;b.textContent=label;b.onclick=()=>{answers.push(label);step=node[key];render()};row.append(b)})}else{const b=document.createElement('button');b.className='reset';b.textContent='↻ Starta om';b.onclick=()=>{step=0;answers=[];render()};row.append(b)}box.append(row);host.append(box);document.getElementById('trail').textContent=answers.join(' → ')}
</script></body></html>
