<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1730"><title>Diagnos | MedAtlas</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#091326;color:#e8eef9}*{box-sizing:border-box}body{margin:0;line-height:1.6}a{color:#7bded4}header{background:#0c1930;border-bottom:1px solid #273a55;padding:19px 5%}header a{text-decoration:none;font-weight:800;font-size:21px}main{max-width:970px;margin:auto;padding:28px 20px 75px}.back{display:inline-block;margin-bottom:22px}.category{color:#72d9cc;font-size:13px;text-transform:uppercase;letter-spacing:1px}h1{font-size:clamp(28px,5vw,44px);margin:6px 0}h2{font-size:22px;margin:30px 0 12px}.muted{color:#a5b6cb}.notice{border:1px solid #87623b;background:#30261c;padding:15px;border-radius:12px;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#112039;border:1px solid #2c3e59;border-radius:15px;padding:22px}.panel h2{margin-top:0;font-size:19px}.flow{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px}.node{width:100%;max-width:650px;border:1px solid #416079;background:#162944;border-radius:14px;padding:25px;text-align:center}.node h3{font-size:20px;line-height:1.45;margin:10px 0 20px}.node.result{border-color:#398b7f;background:#173b3c}.arrow{color:#76cfc7;font-size:22px}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{font:inherit;border:0;border-radius:9px;padding:11px 25px;cursor:pointer;color:white;font-weight:700}.yes{background:#137e74}.no{background:#365d89}.reset{background:#304662}.trail{font-size:13px;color:#9eb5cb;overflow-wrap:anywhere}.refs li{margin-bottom:9px}.subtle{font-size:12px;color:#9bacc1}footer{border-top:1px solid #263650;padding:22px;text-align:center;color:#9bacc1;font-size:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}.node{padding:16px}} 
</style></head><body><header><a href="./index.html">✚ MedAtlas</a></header><main><a class="back" href="./index.html">← Alla diagnoser</a><div id="page"><p>Hämtar diagnos...</p></div></main><footer>MedAtlas · Utbildningsmaterial · Mata inte in patientuppgifter</footer><script src="./data.js"></script><script>
const params=new URLSearchParams(location.search);const d=diseases.find(x=>x.id===params.get('id'));const host=document.getElementById('page');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const refs={
'Kardiologi':[['ESC – Clinical Practice Guidelines','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines']],
'Gastroenterologi':[['Svensk Gastroenterologisk Förening – riktlinjer','https://svenskgastroenterologi.se/']],
'Neurologi':[['Socialstyrelsen – nationella riktlinjer','https://www.socialstyrelsen.se/kunskapsstod-och-regler/regler-och-riktlinjer/nationella-riktlinjer/']],
'Infektion':[['Folkhälsomyndigheten – kunskapsstöd','https://www.folkhalsomyndigheten.se/']],
'Endokrinologi':[['Internetmedicin – medicinskt kunskapsstöd','https://www.internetmedicin.se/']],
'Njurmedicin':[['KDIGO – Guidelines','https://kdigo.org/guidelines/']],
'Akutmedicin':[['European Resuscitation Council – Guidelines','https://www.erc.edu/guidelines/']]
};
let current='start',trail=[];
if(!d){host.innerHTML='<h1>Diagnosen hittades inte</h1><p><a href="./index.html">Tillbaka till biblioteket</a></p>'}
else{document.title=d.title+' | MedAtlas';host.innerHTML='<div class="category">'+esc(d.category)+'</div><h1>'+esc(d.title)+'</h1><p class="muted">'+esc(d.intro)+'</p><div class="notice">⚠ Utbildningsdemo, inte ett validerat kliniskt beslutsstöd. Algoritmerna är förenklade och inte individuellt faktagranskade. Följ aktuella lokala PM och kontakta senior kollega vid akuta tillstånd.</div><div class="grid"><section class="panel"><h2>Utredning</h2><p>'+esc(d.assessment)+'</p></section><section class="panel"><h2>Handläggning</h2><p>'+esc(d.management)+'</p></section></div><section><h2>Interaktiv handläggningsalgoritm</h2><p class="muted">Besvara frågan med JA eller NEJ. Resultatet är en förenklad vägledning för lärande.</p><div class="flow" id="flow"></div><p class="trail" id="trail"></p></section><section class="panel"><h2>Källor och fortsatt läsning</h2><p class="subtle">Nedan finns relevanta riktlinjeportaler, inte verifierade källhänvisningar till varje enskilt påstående. Kontrollera rätt dokument, version och publiceringsdatum innan klinisk användning.</p><ul class="refs">'+(refs[d.category]||refs.Akutmedicin).map(([name,url])=>'<li><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+esc(name)+'</a></li>').join('')+'<li><a href="https://www.vardhandboken.se/" target="_blank" rel="noopener noreferrer">Vårdhandboken</a></li></ul><p class="subtle">Granskningsstatus: Ej medicinskt granskad · Senast koduppdaterad: 2026-11-12</p></section>';render()}
function render(){const node=d.nodes[current]||shared[current];const flow=document.getElementById('flow');if(!node){flow.textContent='Algoritmsteget saknas.';return}flow.innerHTML='';const box=document.createElement('div');box.className='node'+(node.result?' result':'');const label=document.createElement('div');label.className='category';label.textContent=node.result?'Nästa steg':'Beslutsfråga';box.append(label);const h=document.createElement('h3');h.textContent=node.q||node.result;box.append(h);const buttons=document.createElement('div');buttons.className='choices';if(node.q){[['JA',node.yes,'yes'],['NEJ',node.no,'no']].forEach(([answer,next,cls])=>{const btn=document.createElement('button');btn.className=cls;btn.textContent=answer;btn.onclick=()=>{trail.push(answer+' – '+node.q);current=next;render()};buttons.append(btn)})}else{const btn=document.createElement('button');btn.className='reset';btn.textContent='↻ Starta om';btn.onclick=()=>{current='start';trail=[];render()};buttons.append(btn)}box.append(buttons);flow.append(box);document.getElementById('trail').textContent=trail.join(' → ')}
</script></body></html>
